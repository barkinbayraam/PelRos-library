notes: >-
  DOI confirmed on Crossref (the Crossref author list also contains unrelated names — a metadata error; the authors are
  Andersen and Brečević). The scanned PDF could not be read, so positions are recalled — check against the paper's
  table. Polymorph markers often quoted from this work: aragonite ν1 ≈1083 (IR-active), ν2 ≈854, ν4 doublet ≈713/700;
  vaterite ν4 ≈745; amorphous CaCO3 has split ν3 (~1490/1420) and no sharp ν4. A small 1420/876 pair in polymer or
  oxide spectra (e.g. ZnO, BaTiO3, MXene, paper fillers) usually indicates carbonate contamination. Intensities left
  null. BaCO3 (witherite, common impurity in BaTiO3) has ν2 near 856 cm⁻¹ — not from this source.
