notes: >-
  Bruker Alpha Platinum-ATR, 4000–400 cm⁻¹; compared with microcrystalline cellulose. Paper/recycled fibres show filler
  bands: CaCO3 (≈1428 overlap, 875, 712) and kaolinite (3697/3669/3645/3620 OH, 1100–1010 Si–O, 936–914 Al–OH),
  which must not be mistaken for cellulose bands. The 1428/896 ratio is a common crystallinity indicator.
