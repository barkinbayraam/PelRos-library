notes: >-
  Review article; mode is the review's general KBr-pellet transmission description, not explicitly stated for Fig. 10.
  Also reported in the text: asymmetric CH2 bending over 1485–1380 cm⁻¹. The printed labels for 1640/1592 are
  inconsistent with standard amide I/II nomenclature — positions are reliable, labels should be read with care.
  For α-chitin the text gives amide I split at 1660 and 1630, amide II at 1558 and β-glycosidic C–H at 895 cm⁻¹ (KBr).
  Band positions depend on degree of deacetylation and moisture.
