notes: >-
  Review article; values are approximate and taken from a reproduced figure (Ti3C2 vs Ti3C2–PEG6). The ~3400 O–H
  band disappears after esterification of the –OH groups, while ~550 (Ti–O) is unchanged. MXene FTIR is weak and
  featureless compared with polymers (metallic/free-carrier absorption); some primary papers report no clear peaks.
  Other often-quoted bands (H–O–H bend ~1630, C=O ~1700, weak C–F ~1216) depend on etchant, intercalants and drying
  and are not given in this source. No sampling mode given.
