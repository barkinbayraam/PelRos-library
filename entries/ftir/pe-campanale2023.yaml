notes: >-
  Pristine PE mulch sheet / pellets measured with a diamond ATR (Nicolet Summit, 4000–500 cm⁻¹). The 1472/1462 pair is
  conventionally the CH2 scissoring doublet; the source's "–CH=CH–" label is likely an error. The splitting of the
  1470 and 720 bands arises from orthorhombic crystallinity (both HDPE and LDPE show it; LDPE has an extra CH3 band
  near 1377 cm⁻¹ — general knowledge, not reported here). Weathering adds C=O (~1715) used for the carbonyl index. Intensities not stated.
