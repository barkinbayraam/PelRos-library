notes: >-
  The paper is a critical review of literature assignments; values are "about" positions of bands exclusive to the α
  phase. Use 763 and/or 614 cm⁻¹ to identify α. Table 1 of the paper lists bands whose assignment is disputed in the
  literature (431, 482, 510, 840, 881, 1071, 1176, 1234, 1275, 1401 cm⁻¹). Intensities are not given in the source
  list, so they are left null.
