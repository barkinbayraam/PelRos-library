notes: >-
  These are fitted amide I sub-bands (diamond ATR, 2 cm⁻¹), not resolved peaks; numeric "intensity" values are the
  percentage of the amide I area, not peak heights. Total β-sheet ≈ 58 % for the fibres. Regenerated SF nanoparticles
  show a main maximum at 1622 cm⁻¹. Amorphous / silk I (water-soluble) fibroin has its amide I maximum higher
  (~1640–1650, general literature; not from this source).
  Amide II (~1515–1540) is not covered by this source.
