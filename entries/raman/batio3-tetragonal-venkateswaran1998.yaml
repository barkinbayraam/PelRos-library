notes: 'DOI confirmed on Crossref 2026-10-22; positions not yet checked against the paper text. The ≈185 cm⁻¹ feature
  is an interference dip, not a peak. The sharp ≈305 band and ≈717 band mark tetragonality. In the cubic (paraelectric)
  phase — reached above ~400 K or under pressure — no first-order modes are allowed but broad disorder-induced bands
  near ~260 and ~520 persist; very fine-grained BaTiO3 looks similar. BaCO3 impurity: sharp 1059.'
