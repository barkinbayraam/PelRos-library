notes: DOI confirmed on Crossref 2026-10-22; positions not yet checked against the paper text. Values typical for
  ~514 nm excitation. The paper's three-stage amorphisation model (graphite → nanocrystalline graphite → a-C → ta-C)
  explains G moving ~1580→1600→~1510 cm⁻¹ and I(D)/I(G) rising then falling. D, 2D and D+G disperse with excitation;
  D′ and D+G are often unresolved in GO/rGO/carbon black.
