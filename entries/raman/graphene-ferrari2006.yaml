notes: Positions are approximate ('~') as printed. G of single-layer graphene lies 3–5 cm⁻¹ above bulk graphite
  (text). The 2D band shape (single Lorentzian for monolayer vs. multi-component for bi-/few-layer, Fig. 2b,c) identifies
  layer number; 2D and D positions disperse strongly with laser energy (633 nm values are lower). Doping and strain
  shift G and 2D by several cm⁻¹.
