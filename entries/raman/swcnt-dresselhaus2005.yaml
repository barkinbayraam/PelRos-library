notes: 'DOI confirmed on Crossref 2026-10-22; positions not yet checked against the paper text. RBM: radial breathing
  modes at ~100–350 cm⁻¹ with ω_RBM ≈ 248/d_t (cm⁻¹, d_t in nm) for isolated SWNTs on Si; bundles/environment add
  a constant (ω = A/d_t + B). RBM intensities are resonant, so only tubes in resonance with the laser appear. G−
  position depends on diameter. MWCNTs show no useful RBM and look like defective graphite (D, G, D′, 2D).'
