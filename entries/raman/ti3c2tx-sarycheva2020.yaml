- position: 720
  intensity: m
  label: A1g (C), out-of-plane carbon
source:
  doi: 10.1021/acs.chemmater.0c00359
  citation: Sarycheva & Gogotsi, Chem. Mater. 32, 3480 (2020)
  title: Raman Spectroscopy Analysis of the Structure and Surface Chemistry of Ti3C2Tx MXene
  where: abstract (~120 resonant peak with red/785 nm laser only); other bands recalled — check
status: unverified
checked: 2026-10-22
notes: DOI confirmed on Crossref 2026-10-22; positions not yet checked against the paper text. Band shapes and positions
  depend strongly on excitation (785 nm commonly used; 514/532 nm can damage and gives weaker spectra), on terminations,
  intercalants and hydration. The A1g(C) near 720–730 is the sharpest MXene marker. Oxidation produces anatase (~150
  Eg) — check for it. Positions here are nominal.
