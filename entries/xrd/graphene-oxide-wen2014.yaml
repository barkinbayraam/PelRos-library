notes: The paper names a Bruker D8 Advance but does not state the wavelength; d was computed here assuming Cu Kα1
  (1.540598 Å), except where the paper itself gives d. This GO (Hummers-type, sample "EG-0 h") shows its peak at
  ≈13.0°; HRTEM gave ≈0.61 nm spacing. Typical GO shows a single broad (001) at ≈10–12° (d ≈ 0.75–0.9 nm); the position
  depends on oxidation degree and water content, so this source sits at the low-d end. No graphite (002) remains
  when oxidation is complete.
