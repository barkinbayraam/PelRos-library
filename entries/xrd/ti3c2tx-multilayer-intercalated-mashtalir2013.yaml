notes: 'The paper reports c lattice parameters (c-LP), not 2θ: (0002) d = c/2 and 2θ were computed here for Cu Kα1.
  c-LP 19.5 ± 0.1 Å for HF-etched Ti3C2Tx (≈9.1°), rising on intercalation: urea 25.00, hydrazine 25.48 (26.8 in
  DMF), DMSO 35.04 Å and 44.8 Å after ~3 weeks. Heating the hydrazine sample to 120 °C in vacuum shrinks c-LP to
  20.6 Å. In-plane spacings 2.648 and 1.540 Å are stated (hkl symbols lost in the web text) and give a-LP = 3.057
  Å; Ti3AlC2 a-LP 3.058 Å. Measured with Cu Kα (λ≈1.54 Å). General guidance (not from this paper): the (002) position
  of Ti3C2Tx depends strongly on etchant, cation/water content and drying (≈9–9.5° HF multilayer; ≈6–7° LiF/HCl
  or delaminated films; <6° with large intercalants).'
